<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSTM PDF Generator</title>
<style>
:root{--p:#23459b;--bg:#f3f5f8;--c:#fff;--t:#1d2430;--b:#d8dde5}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:14px}
header{background:var(--p);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 0 0 auto}
.tab{background:rgba(255,255,255,.15);color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer;font:inherit}
.tab.on{background:#fff;color:var(--p);font-weight:bold}
main{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.form{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:10px}
.form h3{margin:14px 0 6px;color:var(--p);font-size:14px;border-bottom:1px solid var(--b);padding-bottom:4px}
label{display:block;margin:6px 0 2px;font-size:12px;color:#556}
input,textarea,select{width:100%;padding:7px;border:1px solid var(--b);border-radius:6px;font:inherit}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:grid;grid-template-columns:3fr 1fr 1.4fr auto;gap:4px;margin-bottom:4px}
button.s{background:#e8f0fa;color:var(--p);border:1px solid #bcd3ee;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button.go{background:var(--p);color:#fff;border:0;width:100%;padding:12px;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;margin-top:14px}
.hint{font-size:11px;color:#778;margin-top:6px}
.li{display:flex;gap:4px;align-items:center;padding:4px 0;border-bottom:1px solid #eee;font-size:12px}
.li span{flex:1}.li small{color:#778}
.paper.en{direction:ltr}.paper.en th,.paper.en td{text-align:left}
.late{color:#c0272d;font-weight:bold}.sum td{text-align:center!important;font-size:11px}.sum b{display:block;font-size:20px;color:var(--p)}
summary{cursor:pointer;font-weight:bold;margin:8px 0;color:var(--p)}details{border:1px solid var(--b);border-radius:6px;padding:4px 8px;margin:6px 0}
.grp{break-inside:avoid}.dim{color:#888}.ok{color:#1b7f3b;font-weight:bold}
/* paper */
.paper{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:14mm;box-shadow:0 2px 10px #0002;font-size:12.5px;line-height:1.7}
.ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--p);padding-bottom:8px;margin-bottom:12px}
.logo{height:52px;display:block}.ph .sub{font-size:11px;color:#667}
.ph .ttl{font-size:18px;font-weight:bold;text-align:left}
.paper table{width:100%;border-collapse:collapse;margin:8px 0}
.paper th,.paper td{border:1px solid #bbb;padding:5px 8px;text-align:right}
.paper th{background:#eaf1fa}
.kv td:first-child{background:#f4f6f9;width:28%;font-weight:bold}
.paper h4{margin:14px 0 4px;color:var(--p);font-size:13.5px}
.pre{white-space:pre-wrap}
.sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:40px;text-align:center}
.sig div{border-top:1px solid #666;padding-top:4px}
.tot td{font-weight:bold}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}header,.form{display:none!important}
 main{display:block;padding:0}.paper{box-shadow:none;margin:0;width:auto}
}
</style>
</head>

<header>

const E=s=>(s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const today=new Date().toISOString().slice(0,10);
let mode="offer",items=[{d:"",q:1,p:0}];

const F={
offer:[
 ["عن العرض",[["ref","رقم العرض"],["date","التاريخ","date"]]],
 ["العميل",[["client","اسم الشركة / العميل"],["contact","الشخص المسؤول"],["phone","التليفون"],["loc","الموقع / العنوان"]]],
 ["الطلب",[["subject","موضوع العرض"],["scope","نطاق العمل / ملاحظات","area"]]],
],
visit:[
 ["بيانات التذكرة",[["ref","رقم التذكرة"],["rdate","تاريخ الإبلاغ","date"],["prio","الأولوية","sel",["عادية","عاجلة","حرجة"]]]],
 ["العميل والموقع",[["client","اسم العميل"],["contact","الشخص المسؤول بالموقع"],["phone","التليفون"],["loc","العنوان / الموقع"]]],
 ["الجهاز والعطل",[["dev","الجهاز / الموديل"],["sn","Serial Number"],["prob","وصف العطل (كما أبلغ العميل)","area"]]],

 ["نتيجة الزيارة (بعد التنفيذ)",[["find","التشخيص / Findings","area"],["act","الإجراءات التي تمت","area"],["parts","القطع المستبدلة"],["status","الحالة","sel",["تم الحل","يحتاج زيارة أخرى","في انتظار قطعة غيار","مُصعّد"]],["next","المتابعة المطلوبة / موعد الزيارة القادمة","area"]]],
]};

function field([id,l,t,o]){
 let h=`<label>${l}</label>`;
 if(t==="area")h+=`<textarea id="${id}" oninput="render()"></textarea>`;
 else if(t==="sel")h+=`<select id="${id}" onchange="render()">${o.map(x=>`<option>${x}</option>`).join("")}</select>`;
 else h+=`<input id="${id}" ${id==="client"?'list="dl_c" onchange="fillClient()"':""} type="${t||"text"}" ${t==="date"?`value="${today}"`:""} oninput="render()">`;
 return h;
}
function buildForm(){
 if(mode==="supply")return buildSupply();
 if(mode==="sched")return buildSched();
 if(MODS[mode])return buildMod();
 if(mode==="dash")return buildDash();
 let h="";
 for(const [t,fs] of F[mode]){h+=`<h3>${t}</h3>`;h+=fs.map(field).join("");}
 if(mode==="offer"){
  h+=`<h3>الأجهزة والأسعار</h3><div id="items"></div><button class="s" onclick="addItem()">+ إضافة بند</button>
  <label>ضريبة القيمة المضافة %</label><input id="vat" type="number" value="14" oninput="render()">
  <h3>الشروط والأحكام (ثابتة — عدّليها لو حبيتي)</h3><textarea id="terms" style="min-height:130px" oninput="render()">${defTerms}</textarea>`;
 }
 if(mode==="install")h+=`<h3>الأجهزة المركّبة</h3><div id="devs"></div><button class="s" onclick="addDev()">+ إضافة جهاز</button>`;
 h+=`<datalist id="dl_c">${D.clients.map(c=>`<option value="${EA(c.name)}">`).join("")}</datalist>`;
 h+=`<h3>المُعِدّ</h3><input id="by" placeholder="الاسم" oninput="render()">
 <button class="go" onclick="window.print()">Generate PDF</button>
 <div class="hint">هتفتح نافذة الطباعة — اختاري Save as PDF كوجهة (Destination).</div>`;
 document.getElementById("form").innerHTML=h;
 if(mode==="offer")drawItems();
 if(mode==="install")drawDevs();
}
function drawItems(){
 document.getElementById("items").innerHTML=items.map((it,i)=>`<div class="item">
 <input placeholder="الوصف" value="${E(it.d)}" oninput="items[${i}].d=this.value;render()">
 <input type="number" placeholder="كمية" value="${it.q}" oninput="items[${i}].q=+this.value;render()">
 <input type="number" placeholder="سعر الوحدة" value="${it.p}" oninput="items[${i}].p=+this.value;render()">
 <button class="s" onclick="items.splice(${i},1);drawItems();render()">✕</button></div>`).join("");
}
function addItem(){items.push({d:"",q:1,p:0});drawItems();render()}
function tab(m){mode=m;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.m===m));document.getElementById("form").dir=["offer","visit","install"].includes(m)?"rtl":"ltr";buildForm();render()}
const kv=(l,v)=>`<tr><td>${l}</td><td class="pre">${E(v)||"&nbsp;"}</td></tr>`;
const head=t=>`<div class="ph"><div><img class="logo" src="${LOGO}" alt="SSTM"><div class="sub">sstm-eg.com</div></div><div class="ttl">${t}</div></div>`;
const sig=(a,b,c)=>`<div class="sig"><div>${a}</div><div>${b}</div><div>${c}</div></div>`;
const n=x=>x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function render(){
 if(mode==="supply")return renderSupply();
 if(mode==="sched")return renderSched();
 if(MODS[mode])return renderMod();
 if(mode==="dash")return renderDash();
 let h;
 if(mode==="offer"){
  const sub=items.reduce((s,i)=>s+(i.q||0)*(i.p||0),0),v=sub*(+val("vat")||0)/100;
  h=head("عرض سعر<br><span class='sub'>Price Offer</span>")+
  `<table class="kv">${kv("رقم العرض",val("ref"))}${kv("التاريخ",val("date"))}${kv("شركة",val("client"))}${kv("المسئول",val("contact"))}${kv("التليفون",val("phone"))}${kv("الموقع",val("loc"))}${kv("الموضوع",val("subject"))}</table>
  <h4>البنود</h4><table><tr><th>#</th><th>الوصف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>
  ${items.map((i,k)=>`<tr><td>${k+1}</td><td>${E(i.d)}</td><td>${i.q||0}</td><td>${n(i.p||0)}</td><td>${n((i.q||0)*(i.p||0))}</td></tr>`).join("")}
  <tr class="tot"><td colspan="4">الإجمالي قبل الضريبة</td><td>${n(sub)}</td></tr>
  <tr class="tot"><td colspan="4">ضريبة القيمة المضافة (${val("vat")||0}%)</td><td>${n(v)}</td></tr>
  <tr class="tot"><td colspan="4">الإجمالي النهائي</td><td>${n(sub+v)}</td></tr></table>
  ${val("scope")?`<h4>نطاق العمل / ملاحظات</h4><div class="pre">${E(val("scope"))}</div>`:""}
  <h4>الشروط والأحكام</h4><div class="pre">${E(val("terms"))}</div>
  ${sig("إعداد: "+E(val("by")),"اعتماد الشركة","موافقة العميل")}`;
 }else if(mode==="install"){
  h=head("تقرير تركيب<br><span class='sub'>Installation Report</span>")+
  `<table class="kv">${kv("رقم التقرير",val("ref"))}${kv("التاريخ",val("date"))}${kv("العميل",val("client"))}${kv("المسؤول",val("contact"))}${kv("التليفون",val("phone"))}${kv("الموقع",val("loc"))}${kv("تاريخ التركيب",val("idate"))}${kv("المهندس",val("eng"))}</table>
  <h4>الأجهزة المركّبة</h4><table><tr><th>#</th><th>الجهاز / الموديل</th><th>Serial Number</th><th>مكان التركيب</th></tr>${devs.map((d,k)=>`<tr><td>${k+1}</td><td>${E(d.d)}</td><td>${E(d.sn)}</td><td>${E(d.loc)}</td></tr>`).join("")}</table>
  <h4>نتيجة التشغيل والاختبار</h4><table class="kv">${kv("النتيجة",val("res"))}${kv("ملاحظات",val("notes"))}</table>
  <h4>إقرار الاستلام</h4><div>أقرّ أنا الموقّع أدناه باستلام الأجهزة المذكورة أعلاه، وأنه تم تركيبها وتشغيلها واختبارها بحضوري.</div>
  ${sig("المهندس: "+E(val("eng")),"اعتماد الشركة: "+E(val("by")),"توقيع العميل")}`;
 }else{
  h=head("تقرير زيارة موقع<br><span class='sub'>Site Visit Report</span>")+
  `<table class="kv">${kv("رقم التذكرة",val("ref"))}${kv("تاريخ الإبلاغ",val("rdate"))}${kv("الأولوية",val("prio"))}</table>
  <h4>العميل والموقع</h4><table class="kv">${kv("العميل",val("client"))}${kv("المسؤول بالموقع",val("contact"))}${kv("التليفون",val("phone"))}${kv("العنوان",val("loc"))}</table>
  <h4>الجهاز والعطل</h4><table class="kv">${kv("الجهاز / الموديل",val("dev"))}${kv("Serial Number",val("sn"))}${kv("وصف العطل",val("prob"))}</table>
  <h4>الزيارة</h4><table class="kv">${kv("تاريخ الزيارة",val("vdate"))}${kv("الوقت",val("vtime"))}${kv("المهندس",val("eng"))}</table>
  <h4>نتيجة الزيارة</h4><table class="kv">${kv("التشخيص",val("find"))}${kv("الإجراءات",val("act"))}${kv("القطع المستبدلة",val("parts"))}${kv("الحالة",val("status"))}${kv("المتابعة",val("next"))}</table>
  ${sig("المهندس: "+E(val("eng")),"اعتماد الشركة: "+E(val("by")),"توقيع العميل")}`;
 }
 document.getElementById("out").innerHTML=`<div class="paper">${h}</div>`;

/* ===== Supply Chain ===== */
const CATS=["Comm Modules","Controllers","Sensors","Device Boards","Enclosures"];
let inv=[],editI=-1,byVal="",repDate=today;
try{inv=JSON.parse(localStorage.getItem("sstm_inv")||"[]")}catch(e){}
const saveInv=()=>{try{localStorage.setItem("sstm_inv",JSON.stringify(inv))}catch(e){}};
const SF=[["cat","s_cat"],["name","s_name"],["stock","s_stock"],["min","s_min"],["ord","s_ord"],["sup","s_sup"],["od","s_od"],["eta","s_eta"],["note","s_note"]];
function buildSupply(){
 const f=document.getElementById("form");
 const list=inv.map((i,k)=>`<div class="li"><span><b>${E(i.name)}</b><br><small>${i.cat} · office ${i.stock} · min ${i.min} · on order ${i.ord}</small></span><button class="s" onclick="editItem(${k})">Edit</button><button class="s" onclick="delItem(${k})">✕</button></div>`).join("")||'<div class="hint">No items yet.</div>';
 f.innerHTML=`<h3>${editI>=0?"Edit item":"Add item"}</h3>
 <label>Category</label><select id="s_cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
 <label>Item / Model</label><input id="s_name" placeholder="e.g. Xiao ESP32-C3, SIM7600, Enclosure for Model X">
 <div class="row"><div><label>In office (qty)</label><input id="s_stock" type="number" min="0" value="0"></div><div><label>Minimum needed</label><input id="s_min" type="number" min="0" value="0"></div></div>
 <div class="row"><div><label>On order (qty)</label><input id="s_ord" type="number" min="0" value="0"></div><div><label>Supplier</label><input id="s_sup"></div></div>
 <div class="row"><div><label>Order date</label><input id="s_od" type="date"></div><div><label>Expected arrival</label><input id="s_eta" type="date"></div></div>
 <label>Notes</label><input id="s_note">
 <button class="s" style="margin-top:8px" onclick="saveItem()">${editI>=0?"Update item":"+ Add item"}</button>
 ${editI>=0?'<button class="s" onclick="editI=-1;buildSupply()">Cancel</button>':""}
 <h3>Items (${inv.length})</h3>${list}
 <h3>Report info</h3><div class="row"><div><label>Report date</label><input id="rd" type="date" value="${repDate}" oninput="repDate=this.value;render()"></div><div><label>Prepared by</label><input id="by" value="${E(byVal)}" oninput="byVal=this.value;render()"></div></div>
 <button class="go" onclick="window.print()">Generate PDF</button>
 <div class="hint">Data saves automatically in this browser. Use backup to move it to another computer.</div>
 <div style="margin-top:6px"><button class="s" onclick="exportInv()">Export backup</button> <button class="s" onclick="document.getElementById('imp').click()">Import backup</button><input type="file" id="imp" accept=".json" hidden onchange="importInv(this)"></div>`;
 if(editI>=0){const it=inv[editI];SF.forEach(([k,id])=>document.getElementById(id).value=it[k]??"")}
}
function saveItem(){
 const o={};SF.forEach(([k,id])=>o[k]=document.getElementById(id).value);
 if(!o.name.trim()){alert("Please enter the item name");return}
 ["stock","min","ord"].forEach(k=>o[k]=Math.max(0,+o[k]||0));
 if(editI>=0)inv[editI]=o;else inv.push(o);
 editI=-1;saveInv();buildSupply();render();
}
function editItem(k){editI=k;buildSupply();document.getElementById("form").scrollTop=0}
function delItem(k){if(confirm("Delete this item?")){inv.splice(k,1);editI=-1;saveInv();buildSupply();render()}}
function exportInv(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(inv)],{type:"application/json"}));a.download="sstm-supply-backup.json";a.click()}
function importInv(el){const r=new FileReader();r.onload=()=>{try{inv=JSON.parse(r.result);saveInv();buildSupply();render()}catch(e){alert("Invalid file")}};r.readAsText(el.files[0])}

function renderSupply(){
 const t0=new Date(repDate||today),days=d=>Math.round((new Date(d)-t0)/864e5);
 const c=inv.map(i=>({...i,short:Math.max(0,i.min-i.stock-i.ord)}));
 const ci=(a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat);
 const stk=c.filter(i=>i.stock>0).sort(ci),need=c.filter(i=>i.short>0).sort(ci),
  onord=c.filter(i=>i.ord>0).sort((a,b)=>(a.eta||"9999").localeCompare(b.eta||"9999"));
 const eta=i=>{if(!i.eta)return "TBD";const d=days(i.eta);return i.eta+(d<0?` <span class="late">(${-d} d overdue)</span>`:d===0?" (today)":` (in ${d} d)`)};
 const tbl=(hd,rows)=>rows.length?`<table><tr>${hd.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.join("")}</table>`:'<div class="hint">None.</div>';
 const tr=a=>`<tr>${a.map(x=>`<td>${x}</td>`).join("")}</tr>`;
 const h=head("Supply Chain Status Report")+
 `<div style="margin-bottom:8px">Date: <b>${repDate}</b>${byVal?` &nbsp;|&nbsp; Prepared by: <b>${E(byVal)}</b>`:""}</div>
 <table class="sum"><tr><td><b>${inv.length}</b>Items tracked</td><td><b>${stk.length}</b>In office</td><td><b>${need.length}</b>Need to order</td><td><b>${onord.length}</b>On order</td></tr></table>
 <h4>1. Needs Ordering</h4>${tbl(["Category","Item","In office","On order","Min needed","Qty to order"],need.map(i=>tr([i.cat,E(i.name),i.stock,i.ord,i.min,`<b>${i.short}</b>`])))}
 <h4>2. On Order — Awaiting Delivery</h4>${tbl(["Category","Item","Qty","Supplier","Ordered","Expected arrival","Notes"],onord.map(i=>tr([i.cat,E(i.name),i.ord,E(i.sup),i.od||"-",eta(i),E(i.note)])))}
 <h4>3. Currently in Office</h4>${tbl(["Category","Item","Qty in office","Min needed","Status"],stk.map(i=>tr([i.cat,E(i.name),i.stock,i.min,i.stock>=i.min?"OK":'<span class="late">Low</span>'])))}`;
 document.getElementById("out").innerHTML=`<div class="paper en">${h}</div>`;
}

/* ===== Schedule & Sites ===== */
let SC={sites:[],types:["Installation","First Visit / Site Survey","Maintenance","Inspection","Repair / Breakdown"],engs:[],visits:[]};
try{const x=JSON.parse(localStorage.getItem("sstm_sched")||"null");if(x)SC=x}catch(e){}
const saveSC=()=>{try{localStorage.setItem("sstm_sched",JSON.stringify(SC))}catch(e){}};
const STAT=["Planned","Done","Postponed","Cancelled"];
const blankV=()=>({site:"",date:today,time:"",type:"",eng:"",status:"Planned",note:""});
let vd=blankV(),vEdit=-1,openD="",sFrom="",sTo="",sBy="";
const EA=x=>E(x).replace(/"/g,"&quot;");
const opts=(arr,sel,ph)=>(ph?`<option value="">${ph}</option>`:"")+arr.map(x=>`<option ${x===sel?"selected":""}>${E(x)}</option>`).join("");
const fmtD=d=>d?new Date(d).toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"}):"-";
function listMgr(key,title,addr){
 const arr=SC[key];
 return `<details ${openD===key?"open":""}><summary>${title} (${arr.length})</summary>
 ${arr.map((x,i)=>`<div class="li"><span>${E(addr?x.n:x)}${addr&&x.a?`<br><small>${E(x.a)}</small>`:""}</span><button class="s" onclick="rmL('${key}',${i})">✕</button></div>`).join("")}
 <div ${addr?'class="row"':""} style="margin-top:6px"><input id="n_${key}" placeholder="Name">${addr?'<input id="a_'+key+'" placeholder="Location / address">':""}</div>
 <button class="s" style="margin-top:4px" onclick="addL('${key}',${addr})">+ Add</button></details>`;
}
function addL(key,addr){
 const n=document.getElementById("n_"+key).value.trim();if(!n)return;
 const names=SC[key].map(x=>(addr?x.n:x).toLowerCase());if(names.includes(n.toLowerCase())){alert("Already in the list");return}
 SC[key].push(addr?{n,a:document.getElementById("a_"+key).value.trim()}:n);
 SC[key].sort((a,b)=>(addr?a.n:a).localeCompare(addr?b.n:b));
 openD=key;saveSC();buildSched();render();
}
function rmL(key,i){if(!confirm("Remove from list? (existing schedule entries are kept)"))return;SC[key].splice(i,1);openD=key;saveSC();buildSched();render()}
function buildSched(){
 const sites=[...new Set([...SC.sites.map(x=>x.n),vd.site].filter(Boolean))];
 const list=SC.visits.map((v,i)=>({v,i})).sort((a,b)=>(a.v.date+a.v.time).localeCompare(b.v.date+b.v.time))
  .map(({v,i})=>`<div class="li"><span><b>${E(v.site)}</b><br><small>${v.date} ${v.time||""} · ${E(v.type)||"-"} · ${E(v.eng)||"-"} · ${v.status}</small></span><button class="s" onclick="editV(${i})">Edit</button><button class="s" onclick="delV(${i})">✕</button></div>`).join("")||'<div class="hint">No visits yet.</div>';
 document.getElementById("form").innerHTML=`<h3>${vEdit>=0?"Edit visit":"Add visit"}</h3>
 <label>Site</label><select onchange="vd.site=this.value">${opts(sites,vd.site,SC.sites.length?"— select site —":"— add a site first (below) —")}</select>
 <div class="row"><div><label>Date</label><input type="date" value="${vd.date}" oninput="vd.date=this.value"></div><div><label>Time</label><input type="time" value="${vd.time}" oninput="vd.time=this.value"></div></div>
 <div class="row"><div><label>Type</label><select onchange="vd.type=this.value">${opts([...new Set([...SC.types,vd.type].filter(Boolean))],vd.type,"— select —")}</select></div>
 <div><label>Assigned to</label><select onchange="vd.eng=this.value">${opts([...new Set([...SC.engs,vd.eng].filter(Boolean))],vd.eng,"— select —")}</select></div></div>
 <label>Status</label><select onchange="vd.status=this.value">${opts(STAT,vd.status)}</select>
 <label>Notes</label><input value="${EA(vd.note)}" oninput="vd.note=this.value">
 <button class="s" style="margin-top:8px" onclick="saveV()">${vEdit>=0?"Update visit":"+ Add to schedule"}</button>
 ${vEdit>=0?'<button class="s" onclick="vEdit=-1;vd=blankV();buildSched()">Cancel</button>':""}
 <h3>Saved lists</h3>${listMgr("sites","Sites",true)}${listMgr("engs","Engineers",false)}${listMgr("types","Visit types",false)}
 <h3>Scheduled visits (${SC.visits.length})</h3>${list}
 <h3>Report options</h3><div class="row"><div><label>From (optional)</label><input type="date" value="${sFrom}" oninput="sFrom=this.value;render()"></div><div><label>To (optional)</label><input type="date" value="${sTo}" oninput="sTo=this.value;render()"></div></div>
 <label>Prepared by</label><input value="${EA(sBy)}" oninput="sBy=this.value;render()">
 <button class="go" onclick="window.print()">Generate PDF</button>
 <div class="hint">Data saves automatically in this browser.</div>
 <div style="margin-top:6px"><button class="s" onclick="exportSC()">Export backup</button> <button class="s" onclick="document.getElementById('imp2').click()">Import backup</button><input type="file" id="imp2" accept=".json" hidden onchange="importSC(this)"></div>`;
}
function saveV(){
 if(!vd.site||!vd.date){alert("Please choose a site and a date");return}
 if(vEdit>=0)SC.visits[vEdit]={...vd};else SC.visits.push({...vd});
 vEdit=-1;vd={...blankV(),date:vd.date};saveSC();buildSched();render();
}
function editV(i){vEdit=i;vd={...SC.visits[i]};buildSched();document.getElementById("form").scrollTop=0}
function delV(i){if(confirm("Delete this visit?")){SC.visits.splice(i,1);vEdit=-1;saveSC();buildSched();render()}}
function exportSC(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(SC)],{type:"application/json"}));a.download="sstm-schedule-backup.json";a.click()}
function importSC(el){const r=new FileReader();r.onload=()=>{try{SC=JSON.parse(r.result);saveSC();buildSched();render()}catch(e){alert("Invalid file")}};r.readAsText(el.files[0])}
function renderSched(){
 const vs=SC.visits.filter(v=>(!sFrom||v.date>=sFrom)&&(!sTo||v.date<=sTo));
 const by={};vs.forEach(v=>(by[v.site]=by[v.site]||[]).push(v));
 const names=Object.keys(by).sort((a,b)=>a.localeCompare(b));
 const cls=st=>st==="Done"?"ok":(st==="Cancelled"||st==="Postponed")?"dim":"";
 const grp=names.map(n=>{
  const a=(SC.sites.find(x=>x.n===n)||{}).a;
  const rows=by[n].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time))
   .map(v=>`<tr><td>${fmtD(v.date)}</td><td>${v.time||"-"}</td><td>${E(v.type)||"-"}</td><td>${E(v.eng)||"-"}</td><td class="${cls(v.status)}">${v.status}</td><td>${E(v.note)}</td></tr>`).join("");
  return `<div class="grp"><h4>${E(n)}${a?` <span class="dim" style="font-weight:normal">— ${E(a)}</span>`:""}</h4><table><tr><th>Date</th><th>Time</th><th>Type</th><th>Assigned to</th><th>Status</th><th>Notes</th></tr>${rows}</table></div>`}).join("");
 const planned=vs.filter(v=>v.status==="Planned").length;
 const range=sFrom||sTo?` &nbsp;|&nbsp; Period: <b>${sFrom||"…"} → ${sTo||"…"}</b>`:"";
 const h=head("Site Visits Schedule")+
 `<div style="margin-bottom:8px">Date: <b>${today}</b>${range}${sBy?` &nbsp;|&nbsp; Prepared by: <b>${E(sBy)}</b>`:""}</div>
 <table class="sum"><tr><td><b>${names.length}</b>Sites</td><td><b>${vs.length}</b>Visits</td><td><b>${planned}</b>Planned</td><td><b>${vs.filter(v=>v.status==="Done").length}</b>Done</td></tr></table>
 ${grp||'<div class="hint">No visits scheduled.</div>'}`;
 document.getElementById("out").innerHTML=`<div class="paper en">${h}</div>`;
}

/* ===== Shared data, Install report, generic modules, Dashboard ===== */
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const D={};["tickets","offers","clients","devices"].forEach(m=>D[m]=ld("sstm_"+m,[]));
const sv=m=>{try{localStorage.setItem("sstm_"+m,JSON.stringify(D[m]))}catch(e){}};

const dAddM=(d,n)=>{const x=new Date(d);x.setUTCMonth(x.getUTCMonth()+n);return x.toISOString().slice(0,10)};
const dDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const refL=r=>r==="@clients"?D.clients.map(c=>c.name):r==="@sites"?SC.sites.map(x=>x.n):SC.engs;
const gTbl=(hd,rows)=>rows.length?`<table><tr>${hd.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`:'<div class="hint">None.</div>';
const late=x=>`<span class="late">${x}</span>`;

/* Installation report (Arabic) */
F.install=[["بيانات التقرير",[["ref","رقم التقرير"],["date","تاريخ التقرير","date"]]],["العميل",[["client","اسم العميل"],["contact","المسؤول"],["phone","التليفون"],["loc","الموقع / العنوان"]]],["التركيب",[["idate","تاريخ التركيب","date"],["eng","المهندس المسؤول"]]],["النتيجة",[["res","نتيجة التشغيل والاختبار","sel",["تم التشغيل والاختبار بنجاح","تم التشغيل مع ملاحظات","لم يكتمل التركيب"]],["notes","ملاحظات","area"]]]];

/* Generic internal modules (English) */
const wEnd=r=>r.idate?dAddM(r.idate,+r.war||12):"";
const wSt=r=>{const e=wEnd(r);if(!e)return"-";const d=dDiff(e,today);return d<0?late("Expired"):d<=60?`<b>Expiring (${d} d)</b>`:"Active"};
const open_=o=>["Sent","Negotiating"].includes(o.status);
const MODS={
 tickets:{title:"Support Tickets",pre:"T-",req:"client",stat:"status",lab:r=>`${r.no} · ${r.client}`,
  fields:[["no","Ticket #"],["client","Client","@clients"],["site","Site","@sites"],["device","Device / Model"],["sn","Serial No."],["problem","Problem description","area"],["rdate","Reported on","date","today"],["prio","Priority",["Normal","Urgent","Critical"]],["status","Status",["Open","Visit Scheduled","In Progress","Waiting for Parts","Resolved"]],["eng","Assigned to","@engs"],["vdate","Visit date","date"],["sdate","Resolved on","date"],["note","Notes / follow-up","area"]],
  cols:[["#",r=>r.no],["Client / Site",r=>E(r.client)+(r.site?"<br><small>"+E(r.site)+"</small>":"")],["Device",r=>E(r.device)+(r.sn?"<br><small>S/N "+E(r.sn)+"</small>":"")],["Problem",r=>E(r.problem)],["Reported",r=>r.rdate||"-"],["Age",r=>r.status==="Resolved"||!r.rdate?"-":dDiff(today,r.rdate)+" d"],["Priority",r=>r.prio],["Status",r=>r.status],["Assigned / Visit",r=>E(r.eng||"-")+"<br><small>"+(r.vdate||"")+"</small>"]],
  sort:(a,b)=>(a.status==="Resolved")-(b.status==="Resolved")||(a.rdate||"").localeCompare(b.rdate||"")},
 offers:{title:"Offers Tracker",pre:"O-",req:"client",stat:"status",lab:r=>`${r.no} · ${r.client}`,
  fields:[["no","Offer #"],["client","Client","@clients"],["subject","Subject"],["value","Value (EGP)","num"],["odate","Sent on","date","today"],["status","Status",["Sent","Negotiating","Accepted","Rejected"]],["fdate","Follow-up on","date"],["contact","Contact person"],["note","Notes","area"]],
  cols:[["#",r=>r.no],["Client",r=>E(r.client)+(r.contact?"<br><small>"+E(r.contact)+"</small>":"")],["Subject",r=>E(r.subject)],["Value (EGP)",r=>n(+r.value||0)],["Sent",r=>r.odate||"-"],["Follow-up",r=>(r.fdate||"-")+(open_(r)&&r.fdate&&r.fdate<today?" "+late("overdue"):"")],["Status",r=>r.status],["Notes",r=>E(r.note)]],
  sort:(a,b)=>(open_(b)-open_(a))||(a.fdate||"9999").localeCompare(b.fdate||"9999"),
  extra:rows=>`<div style="margin:6px 0">Open pipeline: <b>${n(rows.filter(open_).reduce((s,r)=>s+(+r.value||0),0))} EGP</b> &nbsp;|&nbsp; Accepted: <b>${n(rows.filter(r=>r.status==="Accepted").reduce((s,r)=>s+(+r.value||0),0))} EGP</b></div>`},
 clients:{title:"Clients Directory",req:"name",lab:r=>r.name,
  fields:[["name","Company name"],["contact","Contact person"],["phone","Phone"],["email","Email"],["addr","Address","area"]],
  cols:[["Company",r=>E(r.name)],["Contact",r=>E(r.contact)],["Phone",r=>E(r.phone)],["Email",r=>E(r.email)],["Address",r=>E(r.addr)]],sort:(a,b)=>a.name.localeCompare(b.name)},
 devices:{title:"Installed Devices & Warranty",req:"device",lab:r=>`${r.device} · ${r.client||""}`,
  fields:[["client","Client","@clients"],["site","Site","@sites"],["device","Device / Model"],["sn","Serial No."],["idate","Installed on","date","today"],["war","Warranty (months)","num","12"],["note","Notes","area"]],
  cols:[["Client / Site",r=>E(r.client)+(r.site?"<br><small>"+E(r.site)+"</small>":"")],["Device",r=>E(r.device)],["Serial",r=>E(r.sn)],["Installed",r=>r.idate||"-"],["Warranty until",r=>wEnd(r)||"-"],["Warranty",r=>wSt(r)]],
  sort:(a,b)=>(wEnd(a)||"9999").localeCompare(wEnd(b)||"9999")}
};
let mEdit=-1,md={_m:""},mFilter="",mBy="";
const blankM=()=>{const M=MODS[mode],o={_m:mode};M.fields.forEach(([id,l,t,d])=>{o[id]=Array.isArray(t)?t[0]:d==="today"?today:(d??"")});
 if(M.pre){const f0=M.fields[0][0];o[f0]=M.pre+String(Math.max(0,...D[mode].map(r=>parseInt(String(r[f0]).replace(/\D/g,""))||0))+1).padStart(3,"0")}return o};
function buildMod(){
 const M=MODS[mode];if(md._m!==mode){mEdit=-1;mFilter="";md=blankM()}
 const f=M.fields.map(([id,l,t])=>{const v=md[id]??"",isR=typeof t==="string"&&t[0]==="@";let i;
  if(isR||Array.isArray(t))i=`<select onchange="md.${id}=this.value">${opts([...new Set([...(isR?refL(t):t),v].filter(Boolean))],v,isR?"— select —":"")}</select>`;
  else if(t==="area")i=`<textarea oninput="md.${id}=this.value">${E(v)}</textarea>`;
  else i=`<input type="${t==="num"?"number":t==="date"?"date":"text"}" value="${EA(v)}" oninput="md.${id}=this.value">`;
  return `<label>${l}</label>${i}`}).join("");
 const list=D[mode].map((r,i)=>({r,i})).filter(x=>!mFilter||x.r[M.stat]===mFilter).sort((a,b)=>M.sort?M.sort(a.r,b.r):0)
  .map(({r,i})=>`<div class="li"><span><b>${E(M.lab(r))}</b>${M.stat?`<br><small>${r[M.stat]}</small>`:""}</span><button class="s" onclick="editM(${i})">Edit</button><button class="s" onclick="delM(${i})">✕</button></div>`).join("")||'<div class="hint">No records yet.</div>';
 const so=M.stat?M.fields.find(x=>x[0]===M.stat)[2]:null;
 document.getElementById("form").innerHTML=`<h3>${mEdit>=0?"Edit record":"Add new"}</h3>${f}
 <button class="s" style="margin-top:8px" onclick="saveM()">${mEdit>=0?"Update":"+ Add"}</button>${mEdit>=0?' <button class="s" onclick="mEdit=-1;md=blankM();buildMod()">Cancel</button>':""}
 <div class="hint">Clients are managed in the Clients tab; sites and engineers in Schedule &amp; Sites.</div>
 <h3>Records (${D[mode].length})</h3>${so?`<label>Filter (also applies to the PDF)</label><select onchange="mFilter=this.value;buildMod();render()">${opts(so,mFilter,"All")}</select>`:""}${list}
 <h3>Report</h3><label>Prepared by</label><input value="${EA(mBy)}" oninput="mBy=this.value;render()"><button class="go" onclick="window.print()">Generate PDF</button>`;
}
function saveM(){const M=MODS[mode];if(!md[M.req]){alert("Please fill: "+M.fields.find(x=>x[0]===M.req)[1]);return}
 const o={...md};if(mEdit>=0)D[mode][mEdit]=o;else D[mode].push(o);mEdit=-1;sv(mode);md=blankM();buildMod();render()}
function editM(i){mEdit=i;md={...D[mode][i]};buildMod();document.getElementById("form").scrollTop=0}
function delM(i){if(confirm("Delete this record?")){D[mode].splice(i,1);mEdit=-1;md=blankM();sv(mode);buildMod();render()}}
function renderMod(){
 const M=MODS[mode],rows=D[mode].filter(r=>!mFilter||r[M.stat]===mFilter).sort(M.sort||(()=>0));
 const so=M.stat?M.fields.find(x=>x[0]===M.stat)[2]:[];
 const h=head(M.title)+`<div style="margin-bottom:8px">Date: <b>${today}</b>${mFilter?` &nbsp;|&nbsp; Filter: <b>${mFilter}</b>`:""}${mBy?` &nbsp;|&nbsp; Prepared by: <b>${E(mBy)}</b>`:""}</div>
 <table class="sum"><tr><td><b>${rows.length}</b>Total</td>${so.map(x=>`<td><b>${rows.filter(r=>r[M.stat]===x).length}</b>${x}</td>`).join("")}</tr></table>${M.extra?M.extra(rows):""}
 ${gTbl(M.cols.map(c=>c[0]),rows.map(r=>M.cols.map(c=>c[1](r))))}`;
 document.getElementById("out").innerHTML=`<div class="paper en">${h}</div>`;
}

/* Dashboard */
function buildDash(){document.getElementById("form").innerHTML=`<h3>Dashboard</h3><div class="hint">A live summary of everything saved in the other tabs: visits, tickets, orders, offers and warranties.</div>
 <button class="go" onclick="window.print()">Generate PDF</button>
 <h3>Backup (all data)</h3><div class="hint">Data lives in this browser only. Export regularly.</div><button class="s" onclick="exportAll()">Export all</button> <button class="s" onclick="document.getElementById('impA').click()">Import all</button><input type="file" id="impA" accept=".json" hidden onchange="importAll(this)">`}
function exportAll(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({inv,SC,D})],{type:"application/json"}));a.download="sstm-all-data-backup.json";a.click()}
function importAll(el){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);inv=x.inv||[];SC=x.SC||SC;Object.assign(D,x.D||{});saveInv();saveSC();Object.keys(D).forEach(sv);tab("dash")}catch(e){alert("Invalid file")}};r.readAsText(el.files[0])}
function renderDash(){
 const w=dAddD(today,7);
 const vis=SC.visits.filter(v=>v.status==="Planned"&&v.date<=w).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const tk=D.tickets.filter(t=>t.status!=="Resolved").sort(MODS.tickets.sort);
 const ord=inv.filter(i=>i.ord>0&&i.eta&&i.eta<today),need=inv.filter(i=>i.min-i.stock-i.ord>0);
 const fu=D.offers.filter(o=>open_(o)&&o.fdate&&o.fdate<=w).sort((a,b)=>a.fdate.localeCompare(b.fdate));
 const wr=D.devices.filter(d=>d.idate&&dDiff(wEnd(d),today)<=60).sort((a,b)=>wEnd(a).localeCompare(wEnd(b)));
 const box=(v,l)=>`<td><b>${v}</b>${l}</td>`;
 const h=head("Operations Dashboard")+`<div style="margin-bottom:8px">Date: <b>${today}</b></div>
 <table class="sum"><tr>${box(vis.length,"Visits (next 7 d)")}${box(tk.length,"Open tickets")}${box(ord.length,"Late deliveries")}${box(need.length,"Items to order")}${box(fu.length,"Offer follow-ups")}${box(wr.length,"Warranty alerts")}</tr></table>
 <h4>Upcoming / past-due visits (next 7 days)</h4>${gTbl(["Date","Time","Site","Type","Assigned to"],vis.map(v=>[v.date<today?late(v.date+" (past)"):fmtD(v.date),v.time||"-",E(v.site),E(v.type),E(v.eng)]))}
 <h4>Open support tickets</h4>${gTbl(["#","Client","Problem","Age","Priority","Status"],tk.map(t=>[t.no,E(t.client),E(t.problem),t.rdate?dDiff(today,t.rdate)+" d":"-",t.prio,t.status]))}
 <h4>Late deliveries</h4>${gTbl(["Item","Qty","Supplier","Expected"],ord.map(i=>[E(i.name),i.ord,E(i.sup),late(i.eta)]))}
 <h4>Items to order</h4>${gTbl(["Category","Item","Qty to order"],need.map(i=>[i.cat,E(i.name),i.min-i.stock-i.ord]))}
 <h4>Offers needing follow-up</h4>${gTbl(["#","Client","Value","Follow-up","Status"],fu.map(o=>[o.no,E(o.client),n(+o.value||0),o.fdate<today?late(o.fdate):o.fdate,o.status]))}
 <h4>Warranty expiring within 60 days / expired</h4>${gTbl(["Client","Device","Serial","Warranty until"],wr.map(d=>[E(d.client),E(d.device),E(d.sn),wEnd(d)+" "+(dDiff(wEnd(d),today)<0?late("expired"):"")]))}`;
 document.getElementById("out").innerHTML=`<div class="paper en">${h}</div>`;
}
const TABS=[["dash","Dashboard"],["offer","Offer / عرض سعر"],["install","Installation Report / تقرير تركيب"],["visit","Site Visit / زيارة موقع"],["offers","Offers Tracker"],["tickets","Tickets"],["sched","Schedule & Sites"],["supply","Supply Chain"],["devices","Installed Devices"],["clients","Clients"]];
document.getElementById("tabs").innerHTML=TABS.map(([m,l])=>`<button class="tab" data-m="${m}" onclick="tab('${m}')">${l.replace("&","&amp;")}</button>`).join("");

tab("dash");
</script>
